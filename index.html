<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nacre — The Pearl Oyster</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
  <header>
    <div class="eyebrow">NACRE · PRIVATE COTTAGE</div>
    <h1>The Pearl Oyster</h1>
    <p class="sub">A small living thing beneath the water.</p>
  </header>

  <section class="scene" aria-label="Pearl oyster">
    <div class="moon"></div>
    <div class="water-glow"></div>
    <div class="oyster" aria-hidden="true">
      <div class="shell-top"></div>
      <div class="shell-bottom"></div>
      <div class="pearl" id="pearlOrb"></div>
    </div>
    <div class="ripples"></div>
  </section>

  <section class="panel">
    <div class="status-row">
      <div>
        <span class="label">Pearl growth</span>
        <strong id="growthText">0%</strong>
      </div>
      <div class="pearl-kind" id="pearlKind">Unformed</div>
    </div>
    <div class="bar"><div id="growthBar"></div></div>

    <div class="stats" id="stats"></div>

    <div class="actions" aria-label="Care actions">
      <button data-action="feed">Feed</button>
      <button data-action="moisten">Moisten</button>
      <button data-action="pet">Pet</button>
      <button data-action="sing">Sing to it</button>
      <button data-action="rest">Let it Rest</button>
      <button data-action="inspect">Inspect Pearl</button>
    </div>

    <p class="message" id="message" role="status">The oyster rests quietly.</p>
  </section>

  <section class="history panel">
    <div class="status-row">
      <div>
        <span class="label">Pearl ledger</span>
        <h2>Harvested pearls</h2>
      </div>
      <span class="count" id="pearlCount">0</span>
    </div>
    <div id="historyList" class="history-list">
      <p class="empty">No pearls have been harvested yet.</p>
    </div>
  </section>

  <footer>NACRE · The year is turning.</footer>
</main>
<script src="oyster.js"></script>
</body>
</html>
