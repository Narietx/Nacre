<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nacre — The Pearl Oyster</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">NACRE</p>
      <h1>The Pearl Oyster</h1>
      <p class="subtitle">A small creature in a quiet place.</p>
    </header>

    <section class="panel" id="unlockPanel" aria-label="Private oyster access" style="padding:16px;margin-bottom:16px">
      <p class="eyebrow">PRIVATE COTTAGE</p>
      <label for="accessKey">Enter your Nacre access key</label>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <input id="accessKey" type="password" autocomplete="off" placeholder="Private access key"
          style="flex:1;min-width:160px;background:#171927;border:1px solid #3b3d51;border-radius:10px;padding:12px;color:#eeeaf5">
        <button id="unlockButton" type="button">Unlock Nacre</button>
      </div>
      <p class="message" id="connectionStatus" role="status">The oyster is waiting to be unlocked.</p>
    </section>

    <section class="tank" aria-label="Oyster">
      <div class="moon"></div>
      <div class="water">
        <div class="oyster" id="oyster" aria-label="Magical oyster">
          <div class="shell shell-back"></div>
          <div class="pearl" id="pearl"></div>
          <div class="shell shell-front"></div>
        </div>
      </div>
    </section>

    <section class="reaction" aria-live="polite">
      <span id="reactionText">The oyster rests quietly beneath the water.</span>
    </section>

    <section class="stats" id="stats"></section>

    <section class="growth">
      <div class="row"><span>Pearl forming</span><strong id="growthText">0%</strong></div>
      <div class="bar"><div id="growthBar"></div></div>
    </section>

    <section class="actions">
      <button data-action="feed">Feed</button>
      <button data-action="moisten">Moisten</button>
      <button data-action="pet">Pet</button>
      <button data-action="sing">Sing to it</button>
      <button data-action="rest">Let it Rest</button>
      <button class="primary" data-action="inspect">Inspect Pearl</button>
    </section>

    <section class="collection">
      <div class="section-heading">
        <div>
          <p class="eyebrow">THE LEDGER</p>
          <h2>Pearl Collection</h2>
        </div>
        <strong id="pearlCount">0 pearls</strong>
      </div>
      <div class="collection-summary" id="collectionSummary"></div>
      <div id="ledger"></div>
    </section>

    <footer>Nacre keeps its little world safe in the cottage.</footer>
  </main>
  <script src="oyster.js?v=cloudflare-2"></script>
</body>
</html>
