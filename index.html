<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nacre — The Pearl Oyster</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">NACRE</p>
        <h1>The Pearl Oyster</h1>
        <p class="subtitle">A small creature beneath the water, quietly making something of its own.</p>
      </div>
      <div class="moon" aria-hidden="true">☾</div>
    </header>

    <section class="oyster-room">
      <div class="water-glow"></div>
      <div class="oyster" aria-label="A magical oyster">
        <div class="shell shell-top"></div>
        <div class="shell shell-bottom"></div>
        <div class="pearl-orb" id="pearlOrb"></div>
      </div>
      <p id="moodText" class="mood">The oyster is resting quietly.</p>
    </section>

    <section class="panel">
      <div class="section-heading">
        <h2>Care</h2>
        <span id="lastUpdated">—</span>
      </div>
      <div class="stats" id="stats"></div>
      <div class="actions">
        <button data-action="feed">Feed</button>
        <button data-action="moisten">Moisten</button>
        <button data-action="pet">Pet</button>
        <button data-action="sing">Sing to it</button>
        <button data-action="rest">Let it Rest</button>
      </div>
    </section>

    <section class="panel pearl-panel">
      <div class="section-heading">
        <h2>Current Pearl</h2>
        <span id="growthText">0%</span>
      </div>
      <div class="growth-track"><div id="growthBar"></div></div>
      <p id="pearlStatus">Something is forming in the dark.</p>
      <button id="harvestButton" class="harvest" disabled>Inspect Pearl</button>
      <div id="currentPearl" class="pearl-card hidden"></div>
    </section>

    <section class="panel collection-panel">
      <div class="section-heading">
        <h2>Pearl Collection</h2>
        <span id="collectionCount">0 pearls</span>
      </div>
      <div id="collectionSummary" class="collection-summary"></div>
      <div id="collection" class="collection"></div>
    </section>

    <footer>
      <span>Nacre</span><span>•</span><span>Your little oyster remembers.</span>
    </footer>
  </main>
  <script src="oyster.js"></script>
</body>
</html>
